# SKI3011 schedule: the single source for the schedule, week pages, deadlines page and calendar.
# NOTE: dates are placeholders from the 2025-2026 academic calendar.
code: SKI3011
title: "Evidence Synthesis 2: Statistics in Systematic Reviewing"
period: 5
weeks:
  - week: 1
    date: 2026-04-01
    theme: "Your topic, your protocol and Covidence"
    lecture:
      - Course overview
      - Choosing your topic and research question
      - Protocols on protocols.io
      - "Introduction: Covidence"
    tutorial:
      - Search and find your topic
      - Import in Zotero and Covidence
      - PRISMA flow chart in Covidence
      - "Choose your partner (groups of 1-3)"
    homework:
      - "Create: protocols.io account and Covidence project"
      - "Watch: Covidence webinar"
      - "Covidence: title/abstract screening"
      - "Install: R and RStudio"
  - week: 2
    date: 2026-04-08
    theme: "R basics"
    lecture:
      - "R basics: R as a calculator, vectors, data frames, importing data, scripts, basic plots"
    tutorial:
      - "Covidence: full text screening and data extraction forms"
      - "R: run the lecture script on your own"
    assignments:
      - {id: A1, title: "Protocol registered on protocols.io", due: "2026-04-14 11:59", grading: pass/fail}
    homework:
      - "Qualitative data extraction: study characteristics and risk of bias (robvis) of all primary papers"
  - week: 3
    date: 2026-04-15
    theme: "Meta-analysis in R I"
    lecture:
      - "Effect sizes with escalc(), rma(yi, vi), forest plots"
      - Proportions and correlations
    quiz: {n: 1, topic: "Interpreting R code and output from lecture 2 (R basics)"}
    tutorial:
      - "Covidence: quantitative extraction, export to csv"
      - "R: first meta-analysis on your own data"
    homework:
      - Quantitative data extraction of all primary papers
  - week: 4
    date: 2026-04-22
    theme: "Meta-analysis in R II"
    lecture:
      - "Binary (RR, OR) and continuous (MD, SMD) outcomes"
    quiz: {n: 2, topic: "Interpreting R code and output from lecture 3 (meta-analysis in R I)"}
    tutorial:
      - "R: meta-analysis on your own data with binary or continuous outcomes"
    assignments:
      - {id: A2, title: "1st draft: introduction, methods, results + R code + dataset", due: "2026-04-28 11:59", grading: pass/fail}
  - week: 5
    date: 2026-04-29
    theme: "Heterogeneity and publication bias"
    lecture:
      - "I², tau², prediction interval"
      - "Funnel plot, Egger test, trim-and-fill"
      - "Leave-one-out and cumulative meta-analysis"
    quiz: {n: 3, topic: "Interpreting R code and output from lecture 4 (meta-analysis in R II)"}
    tutorial:
      - "R: heterogeneity and publication bias on your own data"
    assignments:
      - {id: A3, title: "2nd draft + R code + dataset", due: "2026-05-05 11:59", grading: pass/fail}
  - week: 6
    date: 2026-05-06
    theme: "Subgroups, meta-regression and peer review"
    lecture:
      - Subgroup analysis and meta-regression
    quiz: {n: 4, topic: "Interpreting R code and output from lecture 5 (heterogeneity and publication bias)"}
    tutorial:
      - Peer review
    assignments:
      - {id: A4, title: "Individual peer review", due: "2026-05-11 11:59", grading: "15%"}
  - week: 7
    date: 2026-05-13
    theme: "From carbon to silicon"
    lecture:
      - "Claude Code demo"
    quiz: {n: 5, topic: "Interpreting R code and output from lecture 6 (subgroup analysis and meta-regression)"}
    tutorial:
      - AI on own project
      - "Course evaluation (oral)"
    homework:
      - "Optional: install Claude Code"
  - week: 8
    date: 2026-05-18
    exam_week: true
    theme: "Exam week: final paper"
    assignments:
      - {id: A5, title: "Final paper + R code + dataset", due: "2026-05-22 23:59", grading: "60%"}
assessment:
  - ["Quizzes 1-5 (paper, in the tutorial, interpreting R code and output)", "25%", "Best 4 of 5 count"]
  - ["A4 Individual peer review", "15%", "Individual"]
  - ["A5 Final paper + R code + dataset", "60%", "Group of 1-3 students"]
  - ["A1-A3 Progress assignments", "0%", "Pass/fail"]

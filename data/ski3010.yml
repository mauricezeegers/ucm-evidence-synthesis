# SKI3010 schedule: the single source for the schedule, week pages, deadlines page and calendar.
# Edit here, then run `quarto preview` or `quarto render`. Dates: YYYY-MM-DD, deadlines: "YYYY-MM-DD HH:MM" (Maastricht time).
# NOTE: dates are placeholders from the 2025-2026 academic calendar.
code: SKI3010
title: "Evidence Synthesis 1: Study Designs in Systematic Reviewing"
period: 4
weeks:
  - week: 1
    date: 2026-01-28
    theme: "Systematic reviews and observational studies"
    lecture:
      - Course overview
      - Systematic literature reviews
      - Observational study designs
      - Risk of bias and the Newcastle-Ottawa Scale (NOS)
      - "Data extraction: study characteristics"
      - Example primary paper
    tutorial:
      - "Introduction: systematic review and research topic"
      - "Search and find relevant papers (different databases)"
      - Choose your partner
    homework:
      - "Read the 6 primary studies and make a PRISMA flow chart"
      - "Read: Chapter 11, Textbook of Epidemiology"
      - "Install: Zotero"
  - week: 2
    date: 2026-02-04
    theme: "Measures of frequency and association"
    lecture:
      - "Data extraction: measures of frequency and association"
    quiz: {n: 1, topic: "Systematic literature reviews and observational study designs"}
    tutorial:
      - Study characteristics and risk of bias
    assignments:
      - {id: A1a, title: "Study characteristics and risk of bias of all primary papers (spreadsheet)", due: "2026-02-10 11:59", grading: pass/fail}
      - {id: A1b, title: "1st draft: outline, introduction, methods, results incl. robvis plot", due: "2026-02-10 11:59", grading: pass/fail}
    homework:
      - "Read: Chapter 4.3, Textbook of Epidemiology"
      - "Read: risk of bias tools (NOS) and the PRISMA 2020 statement"
  - week: 3
    date: 2026-02-11
    theme: "Meta-analysis by hand"
    lecture:
      - "Introduction: meta-analysis"
      - Meta-analysis by hand
    quiz: {n: 2, topic: "Measures of frequency and association"}
    tutorial:
      - Quantitative data extraction
    assignments:
      - {id: A2a, title: "Quantitative data extraction of all primary papers", due: "2026-02-24 11:59", grading: pass/fail}
      - {id: A2b, title: "2nd draft: introduction, methods, results", due: "2026-02-24 11:59", grading: pass/fail}
    homework: []
  - break: "Carnival: no education"
    date: 2026-02-18
  - week: 4
    date: 2026-02-25
    theme: "Meta-analysis in JASP"
    lecture:
      - "Introduction: JASP"
    quiz: {n: 3, topic: "Meta-analysis: introduction and meta-analysis by hand"}
    tutorial:
      - Meta-analysis by hand
    assignments:
      - {id: A3, title: "3rd draft: introduction, methods, results", due: "2026-03-03 11:59", grading: pass/fail}
    homework:
      - "Install: JASP"
  - week: 5
    date: 2026-03-04
    theme: "Writing up your review"
    lecture:
      - "Optional: Q&A"
    quiz: {n: 4, topic: "Meta-analysis in JASP"}
    tutorial:
      - Meta-analysis in JASP
    assignments:
      - {id: A4a, title: "Meta-analysis in JASP", due: "2026-03-10 11:59", grading: pass/fail}
      - {id: A4b, title: "4th draft: introduction, methods, results, discussion", due: "2026-03-10 11:59", grading: pass/fail}
    homework:
      - "Read: risk of bias tools for systematic reviews and the PRISMA 2020 checklist"
  - week: 6
    date: 2026-03-11
    theme: "Peer review"
    lecture:
      - "Optional: Q&A"
    tutorial:
      - Peer review
      - "Course evaluation (written)"
    assignments:
      - {id: A5, title: "Individual peer review", due: "2026-03-17 11:59", grading: "15%"}
    homework:
      - "Read: Chapters 3 and 4.3, Textbook of Epidemiology"
  - week: 7
    date: 2026-03-16
    exam_week: true
    theme: "Exam week: final paper"
    assignments:
      - {id: A6, title: "Final paper, incorporating the peer review feedback", due: "2026-03-20 23:59", grading: "65%"}
    homework:
      - "Install: R and RStudio (for SKI3011)"
      - "Start thinking about your own research topic and group for SKI3011"
assessment:
  - ["Quizzes 1-4 (paper, in the tutorial)", "20%", "Best 3 of 4 count"]
  - ["A5 Individual peer review", "15%", "Individual"]
  - ["A6 Final paper", "65%", "Group of 1-3 students"]
  - ["A1-A4 Progress assignments", "0%", "Pass/fail"]
